name: backtest
on:
  push:
  schedule:
    - cron: '0 11 * * *'
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run pip install -r requirements.txt
        run: pip install -r requirements.txt
      - name: Run python backtest_ag5_v20_3.py
        run: python backtest_ag5_v20_3.py
      - name: Run python backtest_ag6_v1_1_elite.py
        run: python backtest_ag6_v1_1_elite.py
      - name: Run python backtest_ag6_v1_2_elite.py
        run: python backtest_ag6_v1_2_elite.py
      - name: Run cat HISTORY
        run: cat HISTORY*.csv || true
