name: backtest
on:
  push:
  schedule:
    - cron: '0 11 * * *'
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python backtest_ag5_v16_3_core.py
      - run: python backtest_ag5_v15_1_core.py
      - run: echo "=== v14.17 CORE (ชื่อเดิม: v14.17 CORE) ===" && cat HISTORY_AG5_CORE.csv | tail -3
      - run: echo "=== v15.1-C CORE (ชื่อเดิม: v15.1-C [ALLGOLD]) ===" && cat HISTORY_AG5_V15_1_CORE.csv | tail -3
      - name: save history
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add HISTORY_*.csv || true
          git commit -m "daily log $(date +%F) CORE compare" || true
          git push || true
